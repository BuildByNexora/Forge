[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "forge-queue"
version = "0.1.0"
description = "Embedded-first job queue for Python, powered by Rust"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Forge contributors" }]
keywords = [
    "job-queue", "task-queue", "queue",
    "rust", "python", "embedded", "persistent",
    "redis-alternative", "celery-alternative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: BSD License",
]

[project.urls]
Homepage = "https://github.com/BuildByNexora/Forge"
Repository = "https://github.com/BuildByNexora/Forge"
Issues = "https://github.com/BuildByNexora/Forge/issues"

[tool.maturin]
manifest-path = "crates/forge-py/Cargo.toml"
module-name = "forge._native"
python-source = "python"
